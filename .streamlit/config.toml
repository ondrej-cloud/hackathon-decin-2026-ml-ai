[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#167c9c"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1d1f"
linkColor = "#167c9c"
borderColor = "#d2d2d7"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "14px"
buttonRadius = "full"
baseFontSize = 17
font = "sans-serif"
headingFontWeights = [700, 700, 700, 700, 700, 700]
metricValueFontWeight = 800
dataframeHeaderBackgroundColor = "#f5f5f7"
dataframeBorderColor = "#e5e5ea"
blueBackgroundColor = "#ffffff"
blueTextColor = "#1d1d1f"
chartCategoricalColors = ["#167c9c", "#cb6c31", "#666666", "#9fcad8"]

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f7"
