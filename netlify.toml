# Web field-zero.netlify.app: složka web/ se publikuje tak, jak je, bez build kroku. Návod v docs/WEB.md.
# Hlavičky: obecné pravidlo první, konkrétnější pod ním, aby u stejné hlavičky platilo to konkrétnější.
# X-Frame-Options se nenastavuje, mapy a animace běží v iframu na stejné doméně.

[build]
  publish = "web"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/data/dnesek.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/mapa/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/animace/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
